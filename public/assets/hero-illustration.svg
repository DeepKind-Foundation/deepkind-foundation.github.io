<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none" aria-hidden="true">
  <defs>
    <!-- Central sphere gradient: cyan highlight → purple body → fades out -->
    <radialGradient id="orb-fill" cx="36%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#3730A3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0C0E1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient glow behind sphere -->
    <radialGradient id="glow-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur-xl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blur-md" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow-dot" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Ambient atmosphere ───────────────────────────────── -->
  <circle cx="280" cy="280" r="185" fill="url(#glow-fill)" filter="url(#blur-xl)"/>
  <circle cx="260" cy="265" r="90"  fill="#7C3AED" fill-opacity="0.12" filter="url(#blur-xl)"/>

  <!-- ── Outermost subtle boundary ring ──────────────────── -->
  <circle cx="280" cy="280" r="252"
    stroke="white" stroke-opacity="0.035" stroke-width="1"/>

  <!-- ── Orbit 1 — Tech (cyan), wide tilted ellipse ───────── -->
  <ellipse cx="280" cy="280" rx="232" ry="76"
    transform="rotate(-22 280 280)"
    stroke="#00E5FF" stroke-width="1" stroke-opacity="0.20"
    stroke-dasharray="11 7"/>

  <!-- ── Orbit 2 — Nature + Agency (purple), mid ellipse ──── -->
  <ellipse cx="280" cy="280" rx="188" ry="60"
    transform="rotate(44 280 280)"
    stroke="#9D5FFF" stroke-width="1" stroke-opacity="0.26"
    stroke-dasharray="14 5"/>

  <!-- ── Orbit 3 — Empathy (rose), near-vertical ellipse ──── -->
  <ellipse cx="280" cy="280" rx="66" ry="234"
    transform="rotate(9 280 280)"
    stroke="#FB7185" stroke-width="0.75" stroke-opacity="0.18"
    stroke-dasharray="7 10"/>

  <!-- ── Sphere surface latitude / meridian ghosts ─────────── -->
  <ellipse cx="280" cy="280" rx="120" ry="38"
    stroke="white" stroke-opacity="0.055" stroke-width="0.75" fill="none"/>
  <ellipse cx="280" cy="280" rx="120" ry="78"
    stroke="white" stroke-opacity="0.035" stroke-width="0.75" fill="none"/>
  <ellipse cx="280" cy="280" rx="38"  ry="120"
    stroke="white" stroke-opacity="0.055" stroke-width="0.75" fill="none"/>

  <!-- ── Central sphere ────────────────────────────────────── -->
  <circle cx="280" cy="280" r="120" fill="url(#orb-fill)"/>

  <!-- Specular shine -->
  <ellipse cx="248" cy="238" rx="46" ry="30"
    fill="white" fill-opacity="0.07"
    transform="rotate(-20 248 238)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- NODE GLOWS (soft halos rendered below the crisp dots)  -->
  <!-- Tech / cyan — top-right -->
  <circle cx="458" cy="188" r="22" fill="#00E5FF" fill-opacity="0.18" filter="url(#blur-md)"/>
  <!-- Nature / purple — left -->
  <circle cx="108" cy="222" r="18" fill="#9D5FFF" fill-opacity="0.22" filter="url(#blur-md)"/>
  <!-- Empathy / rose — upper area -->
  <circle cx="338" cy="62"  r="18" fill="#FB7185" fill-opacity="0.20" filter="url(#blur-md)"/>
  <!-- Agency / amber — bottom-right -->
  <circle cx="434" cy="380" r="18" fill="#FBBF24" fill-opacity="0.20" filter="url(#blur-md)"/>
  <!-- Neuro — bottom-left -->
  <circle cx="185" cy="484" r="16" fill="#7C3AED" fill-opacity="0.20" filter="url(#blur-md)"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- DATA LINES (dashed, from node toward sphere surface)   -->
  <line x1="458" y1="188" x2="384" y2="244"
    stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="4 4"/>
  <line x1="108" y1="222" x2="178" y2="258"
    stroke="#9D5FFF" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="4 4"/>
  <line x1="338" y1="62"  x2="296" y2="163"
    stroke="#FB7185" stroke-width="0.8" stroke-opacity="0.24" stroke-dasharray="4 5"/>
  <line x1="434" y1="380" x2="368" y2="334"
    stroke="#FBBF24" stroke-width="0.8" stroke-opacity="0.24" stroke-dasharray="4 4"/>
  <line x1="185" y1="484" x2="242" y2="396"
    stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.24" stroke-dasharray="4 5"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- ORBITAL NODES (crisp dots with ring)                   -->

  <!-- Tech / cyan -->
  <circle cx="458" cy="188" r="5.5" fill="#00E5FF" filter="url(#glow-dot)"/>
  <circle cx="458" cy="188" r="10"
    stroke="#00E5FF" stroke-width="1" stroke-opacity="0.38" fill="none"/>

  <!-- Nature / purple -->
  <circle cx="108" cy="222" r="4.5" fill="#9D5FFF" filter="url(#glow-dot)"/>
  <circle cx="108" cy="222" r="9"
    stroke="#9D5FFF" stroke-width="1" stroke-opacity="0.38" fill="none"/>

  <!-- Empathy / rose -->
  <circle cx="338" cy="62"  r="4.5" fill="#FB7185" filter="url(#glow-dot)"/>
  <circle cx="338" cy="62"  r="9"
    stroke="#FB7185" stroke-width="1" stroke-opacity="0.34" fill="none"/>

  <!-- Agency / amber -->
  <circle cx="434" cy="380" r="4.5" fill="#FBBF24" filter="url(#glow-dot)"/>
  <circle cx="434" cy="380" r="9"
    stroke="#FBBF24" stroke-width="1" stroke-opacity="0.34" fill="none"/>

  <!-- Neuro / deep purple -->
  <circle cx="185" cy="484" r="4"   fill="#7C3AED" filter="url(#glow-dot)"/>
  <circle cx="185" cy="484" r="8"
    stroke="#7C3AED" stroke-width="1" stroke-opacity="0.34" fill="none"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- MICRO SCATTER DOTS                                     -->
  <circle cx="168" cy="128" r="2"   fill="white"   fill-opacity="0.12"/>
  <circle cx="466" cy="298" r="1.5" fill="#00E5FF" fill-opacity="0.32"/>
  <circle cx="90"  cy="396" r="2"   fill="white"   fill-opacity="0.10"/>
  <circle cx="484" cy="466" r="1.5" fill="#FB7185" fill-opacity="0.28"/>
  <circle cx="72"  cy="148" r="1.5" fill="#9D5FFF" fill-opacity="0.32"/>
  <circle cx="502" cy="122" r="1.5" fill="white"   fill-opacity="0.09"/>
  <circle cx="418" cy="514" r="1.5" fill="#FBBF24" fill-opacity="0.28"/>
  <circle cx="322" cy="500" r="2"   fill="white"   fill-opacity="0.08"/>
  <circle cx="52"  cy="310" r="1.5" fill="#FB7185" fill-opacity="0.20"/>

  <!-- ─────────────────────────────────────────────────────── -->
  <!-- CORNER ACCENTS                                         -->

  <!-- Top-left: cross -->
  <line x1="50" y1="72" x2="68" y2="72"
    stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.30"/>
  <line x1="59" y1="63" x2="59" y2="81"
    stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.30"/>

  <!-- Top-right: rotated square -->
  <rect x="477" y="53" width="12" height="12"
    transform="rotate(45 483 59)"
    stroke="#9D5FFF" stroke-width="1.5" stroke-opacity="0.32" fill="none"/>

  <!-- Bottom-right: cross -->
  <line x1="490" y1="484" x2="508" y2="484"
    stroke="#FB7185" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.24"/>
  <line x1="499" y1="475" x2="499" y2="493"
    stroke="#FB7185" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.24"/>

  <!-- Bottom-left: open circle -->
  <circle cx="66" cy="482" r="7"
    stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.28" fill="none"/>
</svg>
